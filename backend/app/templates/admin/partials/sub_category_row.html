<tr data-id="{{ sub.id }}">
  <td>
    {% if sub.image %}
    <img class="cat-img-cell" src="{{ sub.image }}" alt="{{ sub.name }}">
    {% else %}
    <div class="cat-img-cell" style="display:flex;align-items:center;justify-content:center;color:var(--accent);">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5L4 21"/></svg>
    </div>
    {% endif %}
  </td>
  <td>
    <div class="cat-name-cell"><strong>{{ sub.name }}</strong></div>
  </td>
  <td data-label="Category">{{ parent_category.name if parent_category else "—" }}</td>
  <td data-label="Slug"><span class="cat-slug-pill">{{ sub.slug }}</span></td>
  <td data-label="Total Products"><span class="cat-products-count">{{ sub.totalProducts }}</span></td>
  <td data-label="Status">
    <button type="button"
      class="admin-badge cat-status-toggle {{ 'admin-badge--success' if sub.status == 'active' else 'admin-badge--danger' }}"
      hx-post="/admin/subcategories/{{ sub.id }}/toggle-status"
      hx-target="closest tr" hx-swap="outerHTML">
      <span class="dot"></span>{{ 'Active' if sub.status == 'active' else 'Inactive' }}
    </button>
  </td>
  <td data-label="Created">{{ sub.createdAt.strftime('%d %b %Y') if sub.createdAt else '—' }}</td>
  <td>
    <div class="cat-actions-cell">
      <button class="cat-action-btn" type="button" aria-label="View {{ sub.name }}"
        hx-get="/admin/subcategories/{{ sub.id }}/view" hx-target="#subCategoryViewBody" hx-swap="innerHTML"
        data-open-modal="subCategoryViewModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="cat-action-btn" type="button" aria-label="Edit {{ sub.name }}"
        hx-get="/admin/subcategories/{{ sub.id }}/edit" hx-target="#subCategoryForm" hx-swap="innerHTML"
        data-open-modal="subCategoryFormModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="cat-action-btn is-danger" type="button" aria-label="Delete {{ sub.name }}"
        hx-get="/admin/subcategories/{{ sub.id }}/confirm-delete" hx-target="#subCategoryDeleteBody" hx-swap="innerHTML"
        data-open-modal="subCategoryDeleteModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
      </button>
    </div>
  </td>
</tr>
