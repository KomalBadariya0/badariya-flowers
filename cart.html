<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Cart — Badariya Flowers</title>
<meta name="description" content="Review your selected products and place your order directly on WhatsApp.">
<link rel="icon" href="/assets/images/logo/logo.png">
<link href="/assets/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="cart">

<header class="site-header" id="siteHeader"></header>

<main>
  <div class="container" style="padding-top:20px; padding-bottom:40px;">
    <nav class="breadcrumb-row" id="breadcrumbRow"></nav>

    <div class="cat-page-head">
      <h1>Your Cart</h1>
      <div class="count" id="cartPageCount"></div>
    </div>

    <!-- Shown when cart has items -->
    <div id="cartFilled" style="display:none">

      <div class="cart-summary-card">
        <span class="amt" id="cartTotalAmt">₹0</span>
        <span class="cnt" id="cartTotalCnt">0 items</span>
      </div>

      <div class="cart-question-card">
        <div>
          <h6>Not sure about sizes or bulk pricing?</h6>
          <p>Chat with us directly — we reply fast on WhatsApp.</p>
        </div>
        <a href="#" id="cartAskWaBtn" class="btn-outline-dark" target="_blank" rel="noopener" style="flex-shrink:0;">Ask on WhatsApp</a>
      </div>

      <div class="cart-items-card">
        <h6 id="cartItemsHeading">Items</h6>
        <div id="cartItemsList"></div>
      </div>

      <div class="cart-items-card cart-message">
        <h6>Add a Note (optional)</h6>
        <textarea id="cartNote" placeholder="Delivery date, address, special instructions…"></textarea>
        <div class="cart-customer-fields">
          <input type="text" id="cartCustomerName" placeholder="Your Name" autocomplete="name">
          <input type="tel" id="cartCustomerPhone" placeholder="Your Phone Number" autocomplete="tel">
        </div>
      </div>

      <div class="cart-confirm-bar">
        <button class="confirm-order-btn" id="cartConfirmBtn" type="button">
          <span id="cartConfirmIcon"></span>
          Place Order on WhatsApp
        </button>
      </div>
    </div>

    <!-- Shown when cart is empty -->
    <div class="cart-empty" id="cartEmpty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <h3>Your cart is empty</h3>
      <p style="color:var(--ink-soft); margin:8px 0 22px;">Browse our collection and add designs you love.</p>
      <a href="/categories" class="btn-gold">Browse Collection</a>
    </div>

  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<a href="#" class="fab-whatsapp" id="fabWa" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"></a>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/catalog.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/cards.js"></script>
<script src="/assets/js/cart-page.js"></script>
</body>
</html>
