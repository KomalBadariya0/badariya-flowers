<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitleTag">Product — Badariya Flowers</title>
<meta name="description" content="Handcrafted design from Badariya Flowers. Add to cart and order instantly on WhatsApp.">
<link rel="icon" href="/assets/images/logo/logo.png">
<link href="/assets/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="product">

<header class="site-header" id="siteHeader"></header>

<main>
  <div class="container">
    <nav class="breadcrumb-row" id="breadcrumbRow"></nav>

    <div class="pdp-grid">
      <div class="pdp-gallery reveal">
        <div class="pdp-gallery-main">
          <button class="pdp-nav-arrow prev" id="pdpPrevBtn" aria-label="Previous product"></button>
          <img id="pdpImg" src="" alt="">
          <button class="pdp-nav-arrow next" id="pdpNextBtn" aria-label="Next product"></button>
        </div>
      </div>

      <div class="pdp-info reveal">
        <span class="eyebrow" id="pdpCatTag" style="display:block;font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-dark)"></span>
        <div class="pdp-price" id="pdpPrice"></div>
        <div class="pdp-moq" id="pdpMoq"></div>
        <h1 class="pdp-title" id="pdpTitle"></h1>
        <div class="pdp-sku" id="pdpSku"></div>

        <div class="pdp-cart-row">
          <button class="btn-dark btn-block" id="pdpAddCartBtn">Add to Cart</button>
        </div>

        <div class="pdp-desc" id="pdpDescWrap">
          <p id="pdpDesc"></p>
        </div>
      </div>
    </div>

    <section class="section related-products">
      <div class="section-head reveal">
        <h2>Related Products</h2>
      </div>
      <div class="prod-scroll" id="relatedScroller"></div>
    </section>
  </div>
</main>

<div class="empty-state" id="notFoundWrap" style="display:none">
  <div class="container text-center py-5">
    <h3>Product not found</h3>
    <p class="text-muted">This product may have been removed or the link is incorrect.</p>
    <a href="/categories" class="btn-dark mt-3 d-inline-flex">Browse Collections</a>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<a href="#" class="fab-whatsapp" id="fabWa" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"></a>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/catalog.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/cards.js"></script>
<script src="/assets/js/product.js"></script>
</body>
</html>
